import java.io.FileInputStream
import java.util.Properties

apply plugin: 'com.android.application'

// Optional release signing; falls back to unsigned when keystore.properties
// is absent so that the project still builds on other machines.
def ksFile = rootProject.file("keystore.properties")
def ksProps = new Properties()
if (ksFile.exists()) {
    ksFile.withInputStream { is -> ksProps.load(is) }
}

android {
    compileSdkVersion 31
    defaultConfig {
        applicationId "net.typeblog.socks"
        minSdkVersion 21
        targetSdkVersion 31
        versionCode 15
        versionName "1.1.1"
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
